<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero Interest EPP Wizard Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg:#f6f7f9; 
    --card:#fff;
    --accent:#007aff;
    --muted:#666;
  }

  * { box-sizing:border-box; }
  body {
    font-family:system-ui, sans-serif;
    background:var(--bg);
    margin:0;
    padding:20px;
  }

  h2 { margin-top:0; color:var(--accent); }

  .step { display:none; background:var(--card); padding:20px; border-radius:16px; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .step.active { display:block; animation:fade .3s ease-in; }
  @keyframes fade { from {opacity:0; transform:translateY(5px);} to {opacity:1; transform:translateY(0);} }

  label { display:block; margin:12px 0 4px; font-weight:500; }
  input, select, textarea {
    width:100%;
    padding:8px 10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:1rem;
  }

  .btns { margin-top:20px; display:flex; justify-content:space-between; }
  button {
    background:var(--accent);
    border:none;
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:1rem;
  }
  button[disabled] { opacity:0.5; cursor:not-allowed; }

  .progress {
    display:flex; gap:4px; margin-bottom:16px;
  }
  .dot {
    flex:1; height:6px; border-radius:4px; background:#ccc;
  }
  .dot.active { background:var(--accent); }

  #saveStatus {
    position:fixed; top:12px; right:12px;
    background:var(--accent); color:#fff;
    padding:6px 10px; border-radius:8px;
    font-size:0.85rem; opacity:0;
    transition:opacity .25s;
  }
  #saveStatus.show { opacity:1; }
</style>
</head>
<body>

<div id="wizard">

  <div class="progress" id="progressDots"></div>

  <!-- Step 1a -->
  <div class="step active" data-step="1a">
    <h2>Step 1a — Basic Information (Insured)</h2>
    <label>Full Name</label><input id="InsuredName">
    <label>Date of Birth</label><input id="InsuredDOB" type="date">
    <label>NRIC / Passport No.</label><input id="InsuredID">
    <div class="btns">
      <button disabled>← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- Step 1b -->
  <div class="step" data-step="1b">
    <h2>Step 1b — Basic Information (Policy Owner)</h2>
    <label>Full Name</label><input id="OwnerName">
    <label>Relationship to Insured</label><input id="OwnerRelation">
    <div class="btns">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- Step 1c -->
  <div class="step" data-step="1c">
    <h2>Step 1c — Basic Information (3rd Party Payor)</h2>
    <label>Payor Name</label><input id="PayorName">
    <label>Relationship</label><input id="PayorRelation">
    <div class="btns">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- Step 2a -->
  <div class="step" data-step="2a">
    <h2>Step 2a — Credit Card Information</h2>
    <label>Cardholder Name</label><input id="CardName">
    <label>Card Number</label><input id="CardNumber">
    <div class="btns">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- Step 2b -->
  <div class="step" data-step="2b">
    <h2>Step 2b — EPP Options</h2>
    <label>Installment Plan</label>
    <select id="EPPPlan">
      <option value="">Select...</option>
      <option value="6">6 months</option>
      <option value="12">12 months</option>
    </select>
    <div class="btns">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="step" data-step="3">
    <h2>Step 3 — Signature</h2>
    <p>(Signature pad placeholder)</p>
    <div class="btns">
      <button onclick="prevStep()">← Back</button>
      <button onclick="nextStep()">Next →</button>
    </div>
  </div>

  <!-- Step 4 -->
  <div class="step" data-step="4">
    <h2>Step 4 — Download PDF</h2>
    <button>⬇ Download PDF (Coming Soon)</button>
    <div class="btns">
      <button onclick="prevStep()">← Back</button>
      <button disabled>Finish</button>
    </div>
  </div>

</div>

<div id="saveStatus">✅ Saved</div>

<script>
const steps = Array.from(document.querySelectorAll('.step'));
let currentStep = 0;
const dots = document.getElementById('progressDots');

// Build progress dots
steps.forEach((_,i)=>{
  const dot=document.createElement('div');
  dot.className='dot';
  dots.appendChild(dot);
});
updateProgress();

function nextStep(){
  if(currentStep < steps.length-1){
    steps[currentStep].classList.remove('active');
    currentStep++;
    steps[currentStep].classList.add('active');
    updateProgress();
  }
}
function prevStep(){
  if(currentStep>0){
    steps[currentStep].classList.remove('active');
    currentStep--;
    steps[currentStep].classList.add('active');
    updateProgress();
  }
}

function updateProgress(){
  const allDots = dots.querySelectorAll('.dot');
  allDots.forEach((d,i)=>d.classList.toggle('active', i<=currentStep));
}
</script>

</body>
</html>
